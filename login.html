<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Siswa - Galeri Proyek</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="assets/images/Gemini_Generated_Image_s8kdkds8kdkds8kd-removebg-preview.png">
    <link rel="stylesheet" href="styles/custom.css"> 
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <input type="checkbox" id="menu">

    <header>
        <div class="logo">
            <i class="bi bi-mortarboard-fill" style="color: #312ECB; font-size: 35px;"></i>
            <h1>SCHOOL <span>GALLERY</span></h1>
        </div>
        
    <nav>
    <a href="index.html">Beranda</a>
    <a href="galeri.html">Galeri Karya</a>
    <a href="profile.html">Profil Siswa</a>
    <a href="upload.html">Upload Karya</a>
    <a href="login.html" class="active">Login</a> </nav>
        
        <label for="menu">
            <div></div>
            <div></div>
            <div></div>
        </label>
    </header>
    <div class="container py-5 mt-5">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-7">
                <div class="card shadow-lg border-0">
                    <div class="card-body p-4 p-md-5">
                        <h2 class="mb-4 text-center fw-bold text-primary">
                            <span style="font-size: 2rem;">👋</span> Selamat Datang
                        </h2>
                        
                        <form id="loginForm">
                            <div class="mb-3">
                                <input 
                                    type="email" 
                                    class="form-control form-control-lg" 
                                    id="email" 
                                    name="email" 
                                    placeholder="Contoh: nama.siswa@sekolah.sch.id" 
                                    required
                                >
                            </div>
                            <div class="mb-4">
                                <input 
                                    type="password" 
                                    class="form-control form-control-lg" 
                                    id="password" 
                                    name="password" 
                                    placeholder="Masukkan kata sandi Anda" 
                                    required
                                >
                            </div>
                            
                            <div class="d-grid mb-3">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    <i class="bi bi-box-arrow-in-right me-1"></i> Masuk
                                </button>
                            </div>

                            <p class="text-center">
                                <a href="#" class="text-secondary text-decoration-none">Lupa Password? (Simulasi)</a>
                            </p>

                            <hr>
                            <p class="text-center mb-0">
                                Belum punya akun? <a href="#" class="fw-bold text-primary">Daftar Sekarang (Simulasi)</a>
                            </p>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-light text-center py-3 mt-5">
        <p class="mb-0 text-muted">&copy; 2025 Galeri Proyek Siswa Sekolah.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts/main.js"></script> 
</body>
</html>
