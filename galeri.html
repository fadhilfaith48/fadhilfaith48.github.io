<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Semua Karya</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/custom.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

    <!-- MODERN NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center" href="index.html">
                <i class="bi bi-mortarboard-fill logoicon text-warning"></i> 
                <span>GALERI <span style="color:#ffeea8;">PROYEK</span></span>
            </a>
            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavCustom" aria-controls="navbarNavCustom" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavCustom">
                <ul class="navbar-nav ms-auto align-items-lg-center">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html"><i class="bi bi-house-door-fill me-1"></i>Beranda</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="galeri.html"><i class="bi bi-image me-1"></i>Galeri Karya</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="profile.html"><i class="bi bi-person-fill me-1"></i>Profil Siswa</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="upload.html"><i class="bi bi-plus-square-fill me-1"></i>Tambah Karya</a>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-login ms-lg-3 mt-2 mt-lg-0" href="login.html"><i class="bi bi-box-arrow-in-right me-1"></i>Login</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <!-- END NAVBAR -->

    <div class="container my-5">
        <h1 class="mb-4">Eksplorasi Semua Karya</h1>
        <div class="row mb-4">
            <div class="col-md-6">
                <input type="text" id="searchInput" class="form-control" placeholder="Cari berdasarkan judul atau siswa..." onkeyup="filterKarya()">
            </div>
            <div class="col-md-3">
                <select id="categoryFilter" class="form-select" onchange="filterKarya()">
                    <option value="all">Semua Kategori</option>
                </select>
            </div>
            <div class="col-md-3">
                <select id="classFilter" class="form-select" onchange="filterKarya()">
                    <option value="all">Semua Kelas</option>
                    <option value="X">Kelas X</option>
                    <option value="XI">Kelas XI</option>
                    <option value="XII">Kelas XII</option>
                </select>
            </div>
        </div>
        <div class="row" id="galeri-semua-karya">
            <!-- JS hasil render kartu galeri -->
        </div>
        <p id="noResult" class="text-center mt-5" style="display:none;">Tidak ada karya yang ditemukan sesuai kriteria.</p>
    </div>

    <footer class="bg-light text-center py-3 mt-5">
        <p class="mb-0 text-muted">&copy; 2025 Galeri Proyek Siswa Sekolah.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts/main.js"></script>
</body>
</html>
