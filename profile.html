<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Siswa | Galeri Proyek</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="assets/images/Gemini_Generated_Image_s8kdkds8kdkds8kd-removebg-preview.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="styles/custom.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    
    <input type="checkbox" id="menu">
    <header>
        <div class="logo">
            <i class="bi bi-mortarboard-fill" style="color: #312ECB; font-size: 35px;"></i>
            <h1>SCHOOL <span>GALLERY</span></h1>
        </div>
        
    <nav>
    <a href="index.html">Beranda</a>
    <a href="galeri.html">Galeri Karya</a>
    <a href="profile.html" class="active">Profil Siswa</a> <a href="upload.html">Upload Karya</a>
    <a href="login.html">Login</a>
</nav>
        
        <label for="menu">
            <div></div>
            <div></div>
            <div></div>
        </label>
    </header>

    <div class="jumbotron-profile text-center text-white py-5 mb-5 animate__animated animate__fadeIn">
        <div class="container" id="profile-header">
            <div class="text-center py-5">
                <div class="spinner-border text-light" role="status"><span class="visually-hidden">Loading...</span></div>
                <p class="mt-2 text-light">Memuat data siswa...</p>
            </div>
        </div>
    </div>

    <div class="container my-5">
        
        <div class="row text-center mb-4 g-3" id="siswa-stats">
            </div>
        
        <hr class="my-5">

        <h2 class="text-center mb-4">📚 Karya dari <span id="siswa-nama-karya-title" class="text-primary">Siswa Ini</span></h2>
        
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" id="karya-siswa-list">
            </div>

        <div id="noKarya" class="alert alert-info text-center mt-5" style="display:none;">
            Siswa ini belum memiliki karya yang diunggah.
        </div>
        
    </div>

    <div class="modal fade" id="profileImageModal" tabindex="-1" aria-labelledby="profileImageModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="profileImageModalLabel">Foto Profil</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center">
                    <img id="modalProfileImage" src="" class="img-fluid rounded" alt="Foto Profil Besar">
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-light text-center py-3 mt-5">
        <p class="mb-0 text-muted">&copy; 2025 Galeri Proyek Sekolah.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts/main.js"></script> 
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const body = document.body;
            
            // Menggunakan event delegation karena elemen .profile-img dimuat oleh JS
            body.addEventListener('click', (e) => {
                if (e.target.classList.contains('profile-img')) {
                    const profileImage = e.target;
                    const modalImage = document.getElementById('modalProfileImage');
                    
                    if (modalImage) {
                        modalImage.src = profileImage.src;
                        // Opsi: mengatur judul modal agar lebih informatif
                        document.getElementById('profileImageModalLabel').textContent = `Foto Profil ${profileImage.alt.replace('Foto Profil ', '')}`;
                    }
                }
            });
        });
    </script>
</body>
</html>
