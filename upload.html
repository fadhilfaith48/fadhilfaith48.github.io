    <!-- UPLOAD FORM -->
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h2 class="mb-4 text-center fw-bold">
                            <i class="bi bi-upload me-2 text-primary"></i>
                            Tambah Karya Siswa
                        </h2>
                        <form id="uploadKaryaForm">
                            <div class="mb-3">
                                <label for="judul" class="form-label fw-semibold">Judul Karya <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="judul" name="judul" placeholder="Masukkan judul karya" required>
                            </div>
                            <div class="mb-3">
                                <label for="deskripsi" class="form-label fw-semibold">Deskripsi Karya <span class="text-danger">*</span></label>
                                <textarea class="form-control" id="deskripsi" name="deskripsi" rows="4" placeholder="Jelaskan karya Anda secara singkat..." required></textarea>
                            </div>
                            <div class="mb-3">
                                <label for="gambar" class="form-label fw-semibold">URL Gambar/Poster <span class="text-danger">*</span></label>
                                <input type="url" class="form-control" id="gambar" name="gambar" placeholder="https://contoh.com/gambar.jpg" required>
                                <div class="form-text">Masukkan link gambar online, atau gunakan <span class="fst-italic">placeholder</span> jika hanya demo.</div>
                            </div>
                            <!-- Pilihan kategori dan kelas, opsional -->
                            <div class="mb-3">
                                <label for="kategori" class="form-label fw-semibold">Kategori Proyek</label>
                                <select class="form-select" id="kategori" name="kategori">
                                    <option value="" disabled selected>Pilih kategori karya</option>
                                    <option value="Fisika">Fisika</option>
                                    <option value="Informatika">Informatika</option>
                                    <option value="Seni">Seni</option>
                                    <option value="Sejarah">Sejarah</option>
                                    <option value="Lainnya">Lainnya</option>
                                </select>
                            </div>
                            <div class="mb-4">
                                <label for="kelas" class="form-label fw-semibold">Kelas</label>
                                <select class="form-select" id="kelas" name="kelas">
                                    <option value="" disabled selected>Pilih kelas</option>
                                    <option value="X">X</option>
                                    <option value="XI">XI</option>
                                    <option value="XII">XII</option>
                                </select>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    <i class="bi bi-send-fill me-1"></i>
                                    Tambah Karya
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
                <div class="text-center mt-4">
                    <a href="galeri.html" class="btn btn-link text-secondary"><i class="bi bi-arrow-left"></i> Kembali ke Galeri</a>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-light text-center py-3 mt-5">
        <p class="mb-0 text-muted">&copy; 2025 Galeri Proyek Siswa Sekolah.</p>

</body>
